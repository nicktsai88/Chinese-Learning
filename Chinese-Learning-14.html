        const playTone = (freq, type, duration) => {
            initAudio();
            if(!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        };

                const progress = total === 0 ? 0 : Math.round((answered / total) * 100);

                const elAns = el('nav-stat-answered'); if(elAns) elAns.innerText = answered;

                const elWro = el('nav-stat-wrong'); if(elWro) elWro.innerText = answered - correct;
                const progBar = el('nav-quiz-progress-bar'); if (progBar) progBar.style.width = `${progress}%`;
            } else {
                statsEl.classList.add('hidden');
                statsEl.classList.remove('flex');
            }
        };

        const syncQuestionsFormat = (state) => {
            if (!state || !state.questions) return state;
            if (state.questions.length > 0 && !state.questions[0].exps) {
                const freshQuestions = generateQuestions();
                state.questions = state.questions.map(oldQ => {
                    const freshQ = freshQuestions.find(fq => fq.q === oldQ.q);
                    if (freshQ) return { ...freshQ, showExplanation: oldQ.showExplanation, selectedAns: oldQ.selectedAns, isCorrect: oldQ.isCorrect };
                    return oldQ;
                });
            }
            return state;
        };

                            <div class="flex gap-3">
                                <button onclick="switchTab('mistakes')" class="text-sm md:text-base text-rose-500 bg-rose-50 hover:bg-rose-100 px-4 py-2 rounded-full font-bold transition-colors border border-rose-200 shadow-sm">看錯題 🩹</button>
                                <button onclick="restartQuizWithConfirm()" class="text-sm md:text-base text-white bg-blue-400 hover:bg-blue-500 px-4 py-2 rounded-full font-bold transition-colors shadow-sm">重新挑戰 🔄</button>
                            </div>
                        </div>
                    </div>`
                : ` <div class="flex justify-end mb-2 relative z-10 w-full max-w-5xl mx-auto">
                        <button onclick="clearQuizHistory()" class="text-sm text-slate-500 hover:text-rose-500 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full font-bold transition-colors border border-slate-200 hover:border-rose-200 shadow-sm flex items-center"><span class="mr-1">🚪</span>放棄作答</button>
                    </div>`;

            let html = `
                <div class="w-full flex-1 p-3 md:p-6 lg:p-8 overflow-y-auto scrollbar-hide" id="quiz-scroll-container">
                    <div class="w-full max-w-5xl mx-auto relative pb-20">
                        ${headerHtml}
                        <div class="space-y-8 w-full mt-4">
            `;
            quizState.questions.forEach((_, qIdx) => { html += `<div id="q-block-${qIdx}">${generateSingleQuestionHtml(qIdx)}</div>`; });
            
            if (!isFinished) {
                html += `
                        <button onclick="finishQuizWaterfall()" class="w-full mt-10 bg-slate-800 hover:bg-slate-900 text-white font-bold py-5 text-xl rounded-2xl shadow-md transition-all">
                            交卷結算 📊
                        </button>`;
            }
            html += `</div></div></div>`;
            container.innerHTML = html;
            
            updateNavStats();

            if (!isFinished) {
                setTimeout(() => {
                    let lastAnsweredIdx = -1;
                    for (let i = 0; i < quizState.questions.length; i++) {
                        if (quizState.questions[i].showExplanation && quizState.questions[i].selectedAns !== -1) {
                            lastAnsweredIdx = i;
                        }
                    }
                    if (lastAnsweredIdx !== -1) {
                        const targetBlock = document.getElementById(`q-block-${lastAnsweredIdx}`);
                        if (targetBlock) {
                            targetBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }, 100);
            }
        };

        const generateSingleQuestionHtml = (qIdx) => {
            const q = quizState.questions[qIdx];
            let optionsHtml = '';
            
            q.opts.forEach((opt, i) => {
                let btnClass = "w-full text-left p-4 text-lg md:text-xl rounded-xl border-2 transition-all duration-200 flex flex-col items-start group mt-3 ";
                let iconClass = "w-8 h-8 rounded-full flex items-center justify-center mr-3 font-bold text-sm shrink-0 shadow-sm ";
                let iconText = String.fromCharCode(65+i);
                let expClass = "mt-3 text-base px-3 py-2 rounded-lg w-full font-medium transition-all duration-300 ";
                let expText = (q.exps && q.exps[i]) ? q.exps[i] : '無詳細解析';
                
                if (!q.showExplanation) {
                    btnClass += "border-slate-200 hover:border-blue-300 hover:bg-blue-50/30 bg-white cursor-pointer";
                    iconClass += "bg-slate-50 text-slate-400 border border-slate-200 group-hover:bg-slate-100";
                    expClass += "hidden";
                } else {
                    expClass += "block ";
                    if (i === q.ans) {
                        btnClass += "border-emerald-400 bg-emerald-50 text-emerald-900 shadow-sm";
                        iconClass += "bg-emerald-400 text-white";
                        iconText = "✓";
                        expClass += "text-emerald-700 bg-emerald-100/50";
                    } else if (i === q.selectedAns) {
                        btnClass += "border-rose-400 bg-rose-50 text-rose-900";
                        iconClass += "bg-rose-400 text-white";
                        iconText = "✗";
                        expClass += "text-rose-700 bg-rose-100/50";
                    } else {
                        btnClass += "border-slate-100 bg-white opacity-60 cursor-not-allowed";
                        iconClass += "bg-slate-50 text-slate-400 border border-slate-200";
                        expClass += "text-slate-500 bg-slate-50";
                    }
                }

                optionsHtml += `
                    <button id="opt-btn-${qIdx}-${i}" ${q.showExplanation ? 'disabled' : ''} onclick="answerWaterfallQuestion(${qIdx}, ${i})" class="${btnClass}">
                        <div class="flex items-center w-full">
                            <span id="opt-icon-${qIdx}-${i}" class="${iconClass}">${iconText}</span>
                            <span class="flex-1 leading-relaxed font-bold">${opt}</span>
                        </div>
                        <div id="opt-exp-${qIdx}-${i}" class="${expClass}"><span class="font-bold mr-1">解析：</span>${expText}</div>
                    </button>
                `;
            });

            const isFav = userData.favorites && userData.favorites.includes(q.q);
            const favBtn = `<button id="fav-btn-${qIdx}" onclick="toggleQuizFavorite(${qIdx})" class="text-2xl hover:scale-110 transition-transform focus:outline-none ml-3">${isFav ? '💖' : '🤍'}</button>`;

            return `
                <div class="content-card p-6 md:p-8 relative" id="q-card-${qIdx}">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed flex-1"><span class="text-blue-500 mr-2">${qIdx + 1}.</span>${q.q}</h3>
                        ${favBtn}
                    </div>
                    <div class="w-full">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        };

        window.toggleQuizFavorite = (qIdx) => {
            const q = quizState.questions[qIdx];
            if (!userData.favorites) userData.favorites = [];
            const idx = userData.favorites.indexOf(q.q);
            const isFav = idx > -1;
            
            if (isFav) {
                userData.favorites.splice(idx, 1);
            } else {
                userData.favorites.push(q.q);
            }
            saveUserDataToCloud();
            
            const favBtnEl = document.getElementById(`fav-btn-${qIdx}`);
            if (favBtnEl) {
                favBtnEl.innerHTML = !isFav ? '💖' : '🤍';
            }
        };

        window.answerWaterfallQuestion = (qIdx, optIdx) => {
            const q = quizState.questions[qIdx];
            if(q.showExplanation) return; 

            q.selectedAns = optIdx;
            q.showExplanation = true;
            q.isCorrect = (optIdx === q.ans);
            
            if (q.isCorrect) {
                playCorrectSound();
            } else {
                playWrongSound();
                if(!userData.mistakes) userData.mistakes = [];
                if(!userData.mistakes.find(m => m.id === q.q)) {
                    userData.mistakes.push({ id: q.q, q: q.q, opts: q.opts, ans: q.ans, exps: q.exps, time: new Date().toISOString() });
                    saveUserDataToCloud();
                }
            }
            saveQuizState();
            
            q.opts.forEach((opt, i) => {
                const btn = document.getElementById(`opt-btn-${qIdx}-${i}`);
                const icon = document.getElementById(`opt-icon-${qIdx}-${i}`);
                const exp = document.getElementById(`opt-exp-${qIdx}-${i}`);
                
                if (!btn || !icon || !exp) return;
                
                btn.disabled = true;
                
                let btnClass = "w-full text-left p-4 text-lg md:text-xl rounded-xl border-2 transition-all duration-200 flex flex-col items-start group mt-3 ";
                let iconClass = "w-8 h-8 rounded-full flex items-center justify-center mr-3 font-bold text-sm shrink-0 shadow-sm ";
                let expClass = "mt-3 text-base px-3 py-2 rounded-lg w-full font-medium transition-all duration-300 block ";
                
                if (i === q.ans) {
                    btnClass += "border-emerald-400 bg-emerald-50 text-emerald-900 shadow-sm";
                    iconClass += "bg-emerald-400 text-white";
                    icon.innerHTML = "✓";
                    expClass += "text-emerald-700 bg-emerald-100/50";
                } else if (i === q.selectedAns) {
                    btnClass += "border-rose-400 bg-rose-50 text-rose-900";
                    iconClass += "bg-rose-400 text-white";
                    icon.innerHTML = "✗";
                    expClass += "text-rose-700 bg-rose-100/50";
                } else {
                    btnClass += "border-slate-100 bg-white opacity-60 cursor-not-allowed";
                    iconClass += "bg-slate-50 text-slate-400 border border-slate-200";
                    icon.innerHTML = String.fromCharCode(65+i);
                    expClass += "text-slate-500 bg-slate-50";
                }
                
                btn.className = btnClass;
                icon.className = iconClass;
                exp.className = expClass;
            });
            
            updateNavStats();
        };

        window.finishQuizWaterfall = async () => {
            let correct = 0; let answered = 0;
            quizState.questions.forEach(q => {
                if (q.showExplanation) { answered++; if (q.isCorrect) correct++; }
            });
            if (answered < quizState.questions.length) {
                if(!confirm(`還有 ${quizState.questions.length - answered} 題未作答，確定直接交卷？`)) return;
            }
            quizState.questions.forEach(q => {
                if (!q.showExplanation) { q.showExplanation = true; q.isCorrect = false; q.selectedAns = -1; }
            });
            quizState.isFinished = true; quizState.correctCount = correct;
            quizState.scorePercent = Math.round((correct / quizState.questions.length) * 100);
            saveQuizState();
            
            if (!userData.quizHistory) userData.quizHistory = [];
            userData.quizHistory.push({ date: new Date().toLocaleString(), score: quizState.scorePercent, total: quizState.questions.length, correct: correct });
            if (userData.quizHistory.length > 50) userData.quizHistory = userData.quizHistory.slice(-50);
            saveUserDataToCloud();

            renderQuizView(el('main-content'));
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.3 } });
            setTimeout(() => { const s = el('quiz-scroll-container'); if (s) s.scrollTo({ top: 0, behavior: 'smooth' }); }, 100);
            updateNavStats();
        };

        window.clearQuizHistory = () => {
            if(confirm('確定放棄目前的作答進度嗎？')) {
                quizState = { active: false, currentQ: 0, score: 0, answers: [], questions: [], showExplanation: false, selectedAns: null };
                saveQuizState();
                renderQuizView(el('main-content'));
                updateNavStats();
            }
        };

        const renderQuestionList = (list, emptyMsg, icon) => {
            if(!list || list.length === 0) {
                return `
                    <div class="flex-1 flex flex-col items-center justify-center p-10 text-slate-400">
                        <div class="text-6xl mb-4 opacity-50">${icon}</div>
                        <h2 class="text-2xl font-bold mb-2">${emptyMsg}</h2>
                    </div>`;
            }
            return `
                <div class="space-y-6 w-full max-w-5xl mx-auto pb-20">
                    ${list.map((m, i) => `
                        <div class="content-card p-6 md:p-8">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-xl font-bold text-slate-800 leading-relaxed"><span class="text-rose-500 mr-2 font-black">Q.</span>${m.q}</h3>
                                ${m.isFavRender ? `<button onclick="toggleFavoritePage('${m.q}')" class="text-2xl ml-3">💖</button>` : ''}
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
                                ${m.opts.map((opt, idx) => `
                                    <div class="p-3 rounded-xl flex flex-col ${idx === m.ans ? 'bg-emerald-50 border border-emerald-200' : 'bg-white border border-slate-100'}">
                                        <div class="flex items-start text-base font-bold ${idx === m.ans ? 'text-emerald-800' : 'text-slate-600'}">
                                            <span class="mr-2">${String.fromCharCode(65+idx)}.</span> 
                                            <span class="flex-1">${opt}</span>
                                            ${idx === m.ans ? '<span class="ml-2">✓</span>' : ''}
                                        </div>
                                        ${(m.exps && m.exps[idx]) ? `<div class="mt-2 text-sm ${idx === m.ans ? 'text-emerald-600' : 'text-slate-400'}"><span class="font-bold">解析：</span>${m.exps[idx]}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).reverse().join('')}
                </div>`;
        };

        window.renderMistakes = (container) => {
            if(!container) container = el('main-content');
            container.innerHTML = `
                <div class="w-full flex-1 p-4 md:p-6 lg:p-8 overflow-y-auto scrollbar-hide">
                    <div class="max-w-5xl mx-auto mb-6 flex justify-between items-end border-b border-rose-200 pb-4 px-2">
                        <h2 class="text-3xl font-extrabold text-rose-700">🩹 錯題本</h2>
                        ${userData.mistakes?.length ? `<button onclick="clearMistakes()" class="text-sm text-rose-500 bg-white border border-rose-200 hover:bg-rose-50 px-3 py-1.5 rounded-full font-bold">清空</button>` : ''}
                    </div>
                    ${renderQuestionList(userData.mistakes, '目前沒有錯題紀錄 🎉', '🥳')}
                </div>`;
        };

        window.clearMistakes = () => {
            if(confirm('確定要清空所有錯題紀錄嗎？')) {
                userData.mistakes = []; saveUserDataToCloud(); renderMistakes();
            }
        };

        window.renderFavorites = (container) => {
            if(!container) container = el('main-content');
            const allQ = generateQuestions();
            const favs = (userData.favorites || []).map(qText => {
                const found = allQ.find(q => q.q === qText) || { q: qText, opts: [], ans: 0, exps: [] };
                return { ...found, isFavRender: true };
            }).filter(f => f.opts.length > 0);

            container.innerHTML = `
                <div class="w-full flex-1 p-4 md:p-6 lg:p-8 overflow-y-auto scrollbar-hide">
                    <div class="max-w-5xl mx-auto mb-6 border-b border-pink-200 pb-4 px-2">
                        <h2 class="text-3xl font-extrabold text-pink-600">💖 我的最愛</h2>
                    </div>
                    ${renderQuestionList(favs, '暫無收藏 📌', '🤍')}
                </div>`;
        };

        window.toggleFavoritePage = (qText) => {
            const idx = userData.favorites.indexOf(qText);
            if (idx > -1) {
                userData.favorites.splice(idx, 1);
                saveUserDataToCloud();
                renderFavorites();
            }
        };

        window.renderHistory = (container) => {
            if(!container) container = el('main-content');
            const hasQuiz = userData.quizHistory?.length > 0;
            const hasLogin = userData.loginHistory?.length > 0;

            container.innerHTML = `
                <div class="w-full flex-1 p-4 md:p-6 lg:p-8 overflow-y-auto scrollbar-hide">
                    <div class="max-w-5xl mx-auto mb-8 border-b border-purple-200 pb-4 px-2">
                        <h2 class="text-3xl font-extrabold text-purple-700">📜 學習紀錄</h2>
                    </div>
                    ${(!hasQuiz && !hasLogin) ? `<div class="text-center p-10 text-slate-400 text-xl font-bold mt-10">尚無紀錄</div>` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
                        <div class="content-card p-6">
                            <h3 class="text-xl font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">🎯 測驗成績</h3>
                            <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-2">
                                ${(userData.quizHistory || []).slice().reverse().map(h => `
                                    <div class="bg-white p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                                        <div class="text-sm">
                                            <div class="font-bold text-slate-700">${h.date}</div>
                                            <div class="text-slate-500">${h.correct} / ${h.total} 題</div>
                                        </div>
                                        <div class="text-2xl font-black ${h.score >= 80 ? 'text-emerald-500' : (h.score < 60 ? 'text-rose-500' : 'text-blue-500')}">${h.score}分</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="content-card p-6">
                            <h3 class="text-xl font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">👣 登入足跡</h3>
                            <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-2">
                                ${(userData.loginHistory || []).slice().reverse().map((t, i) => `
                                    <div class="bg-white p-2.5 rounded-lg border border-slate-100 text-sm font-medium text-slate-600 flex items-center">
                                        <span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center mr-3 text-xs">${i+1}</span>
                                        ${new Date(t).toLocaleString()}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>`}
                </div>`;
        };

        initApp();

    </script>
</body>
</html>
